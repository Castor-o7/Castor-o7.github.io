<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boids — Josh D.</title>
    <meta name="description" content="Interactive boids flocking simulation: flocks emerging from three simple steering rules.">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #888;
            font-family: 'IBM Plex Mono', 'SF Mono', monospace;
            font-size: 14px;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.25rem;
            padding: 1.5rem 1rem;
            text-align: center;
        }
        h1 { color: #d4af37; font-size: 1rem; font-weight: 400; letter-spacing: 0.3em; text-transform: uppercase; }
        #canvas-container { width: 100%; max-width: 1100px; border: 1px solid #222; }
        canvas { display: block; max-width: 100%; height: auto !important; touch-action: none; }
        .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 0.5rem 1rem; }
        .keys { display: none; }
        @media (hover: hover) and (pointer: fine) { .keys { display: inline; } }
        .stats { color: #e8e8e8; font-variant-numeric: tabular-nums; }
        button {
            background: none;
            border: 1px solid #333;
            color: #d4af37;
            font: inherit;
            padding: 0.35rem 0.9rem;
            cursor: pointer;
        }
        button:hover, button:focus-visible { border-color: #d4af37; }
        a { color: #d4af37; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>Boids</h1>
    <main id="canvas-container"></main>
    <div class="controls">
        <span>Click or drag to add boids.</span>
        <button type="button" id="clear">Clear<span class="keys"> (Space)</span></button>
        <button type="button" id="reset">Reset<span class="keys"> (R)</span></button>
        <span class="stats">Boids <span id="boid-count">&ndash;</span> &middot; FPS <span id="fps">&ndash;</span></span>
    </div>
    <p>Based on Craig Reynolds' <a href="https://www.red3d.com/cwr/boids/" target="_blank" rel="noopener">Boids algorithm</a>.</p>
    <p><a href="../../">&larr; Back to case files</a></p>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <script src="boids.js"></script>
</body>
</html>
